<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倉管建單系統 - 頂級版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-color: #10b981; /* 新能源翠綠色 */
            --bg-color: #f4f6f9;     /* 舒服的淺灰底 */
            --text-dark: #1f2937;    /* 深灰字（比純黑高檔） */
        }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-dark);
            padding: 20px 10px;
        }
        .main-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px 24px;
        }
        .header-title {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 1.6rem;
            letter-spacing: 1px;
        }
        /* 加大、加寬的輸入窗格設計 */
        .form-label {
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .form-control, .form-select {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px; /* 大幅增加點擊與打字空間 */
            font-size: 1.05rem;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
            background-color: #fff;
        }
        /* 唯讀狀態的欄位美化 */
        .form-control[readonly] {
            background-color: #f3f4f6;
            border-color: #e5e7eb;
            color: #9ca3af;
        }
        /* 科技感大按鈕 */
        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            color: white;
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .btn-submit:disabled {
            background: #d1d5db;
            box-shadow: none;
            transform: none;
        }
        .loading-box {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner-custom {
            color: var(--primary-color);
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <div class="main-card">
        <div class="text-center mb-4">
            <span style="font-size: 2.5rem;">🔋</span>
            <h2 class="header-title mt-2">儲能設備工單整合系統</h2>
            <p class="text-muted small">倉管端 ‧ 新建維修單</p>
        </div>
        
        <form id="orderForm">
            <div class="mb-4">
                <label class="form-label">建單人員</label>
                <input type="text" id="creator" class="form-control" readonly placeholder="正在透過 LINE 驗證身分...">
            </div>
            
            <div class="mb-4">
                <label class="form-label">維修產品項目</label>
                <select id="productName" class="form-select" required>
                    <option value="" disabled selected>請選擇設備型號</option>
                    <option value="行動式儲能寶">⚡ 行動式儲能寶</option>
                    <option value="移動式大容量行動電源">🔌 移動式大容量行動電源</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="form-label">產品序號 (S/N)</label>
                <input type="text" id="productSn" class="form-control" placeholder="請輸入或掃描產品序號" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">送修日期 (到貨日)</label>
                <input type="date" id="arrivalDate" class="form-control" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">故障原因描述</label>
                <textarea id="faultDescription" class="form-control" rows="4" placeholder="請詳細描述初步檢查之故障狀況..." required></textarea>
            </div>
            
            <div class="mb-4">
                <label class="form-label">客戶資料 (姓名/電話)</label>
                <input type="text" id="customerInfo" class="form-control" placeholder="例：王小明 0988-123456" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">客戶地址 (完修寄回地址)</label>
                <input type="text" id="customerAddress" class="form-control" placeholder="請輸入完整寄回地址" required>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-submit w-100" disabled>儲存工單並推播通知</button>
        </form>
        
        <div id="loadingStatus" class="loading-box">
            <div class="spinner-border spinner-custom" role="status"></div>
            <h5 class="mt-3 fw-bold text-secondary">正在傳輸雲端數據...</h5>
            <p class="text-muted small">請勿關閉視窗，系統正在同步 LINE 通知</p>
        </div>
    </div>
</div>

<script>
    const LIFF_ID = "2010297316-XHe9VMYl"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwFD-KaUyTxusk3JPeqy6uzIuWhoY-BP53D4gO4YAVoZbCXnJJAGIskxl_rEDYuFq9O/exec"; 

    async function initLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById('creator').value = profile.displayName;
                document.getElementById('submitBtn').disabled = false;
            }
        } catch (error) {
            alert('LINE 驗證失敗: ' + error);
        }
    }

    document.getElementById('arrivalDate').valueAsDate = new Date();

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('loadingStatus').style.display = 'block';

        const payload = {
            action: "createOrder",
            creator: document.getElementById('creator').value,
            productName: document.getElementById('productName').value,
            productSn: document.getElementById('productSn').value,
            arrivalDate: document.getElementById('arrivalDate').value,
            faultDescription: document.getElementById('faultDescription').value,
            customerInfo: document.getElementById('customerInfo').value,
            customerAddress: document.getElementById('customerAddress').value
        };

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
                alert('🎉 工單成功建立！\n系統已自動同步資料表並廣播通知維修團隊。');
                liff.closeWindow();
            } else {
                alert('❌ 雲端儲存失敗: ' + result.message);
                resetForm();
            }
        } catch (error) {
            alert('❌ 連線至 Google 伺服器超時: ' + error);
            resetForm();
        }
    });

    function resetForm() {
        document.getElementById('orderForm').style.display = 'block';
        document.getElementById('loadingStatus').style.display = 'none';
    }

    initLiff();
</script>

</body>
</html>
