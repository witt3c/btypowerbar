<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倉管建單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/modern/bootstrap.min.css" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 15px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-submit { background-color: #06C755; color: white; border: none; }
        .btn-submit:hover { background-color: #05b04b; color: white; }
        .loading { display: none; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container max-width-md mt-3">
    <div class="card p-4">
        <h3 class="text-center mb-4 text-primary" style="color: #06C755 !important;">📦 倉管新建維修單</h3>
        
        <form id="orderForm">
            <div class="mb-3">
                <label class="form-label fw-bold">建單人員 (LINE 暱稱)</label>
                <input type="text" id="creator" class="form-control" readonly placeholder="正在載入 LINE 資訊...">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">產品名稱</label>
                <select id="productName" class="form-select" required>
                    <option value="" disabled selected>請選擇產品</option>
                    <option value="行動式儲能寶">行動式儲能寶</option>
                    <option value="移動式大容量行動電源">移動式大容量行動電源</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">產品序號 (S/N)</label>
                <input type="text" id="productSn" class="form-control" placeholder="請輸入或掃描產品序號" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">送修日期</label>
                <input type="date" id="arrivalDate" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">故障原因描述</label>
                <textarea id="faultDescription" class="form-control" rows="3" placeholder="請詳細描述故障狀況..." required></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">客戶資料 (姓名/電話)</label>
                <input type="text" id="customerInfo" class="form-control" placeholder="例：張先生 0912-345678" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">客戶地址</label>
                <input type="text" id="customerAddress" class="form-control" placeholder="請輸入寄回地址" required>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-submit w-100 py-2 fw-bold" disabled>確認送出並發送通知</button>
        </form>
        
        <div id="loadingStatus" class="loading">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-secondary" id="loadingText">工單處理中，請稍候...</p>
        </div>
    </div>
</div>

<script>
    // === 參數設定 ===
    const LIFF_ID = "2010297316-XHe9VMYl"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwFD-KaUyTxusk3JPeqy6uzIuWhoY-BP53D4gO4YAVoZbCXnJJAGIskxl_rEDYuFq9O/exec"; 

    // 初始化 LINE LIFF
    async function initLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login(); // 如果沒登入，強制跳出 LINE 登入畫面
            } else {
                const profile = await liff.getProfile();
                document.getElementById('creator').value = profile.displayName; // 自動帶入 LINE 暱稱
                document.getElementById('submitBtn').disabled = false; // 載入完成，允許按按鈕
            }
        } catch (error) {
            alert('LINE LIFF 初始化失敗: ' + error);
        }
    }

    // 預設送修日期為今天
    document.getElementById('arrivalDate').valueAsDate = new Date();

    // 監聽表單送出事件
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // 防止網頁重新整理
        
        // 顯示載入動畫，隱藏按鈕
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loadingStatus').style.display = 'block';
        document.getElementById('loadingText').innerText = '正在寫入雲端資料庫並發送 LINE 通知...';

        // 收集表單資料
        const payload = {
            action: "createOrder",
            creator: document.getElementById('creator').value,
            productName: document.getElementById('productName').value,
            productSn: document.getElementById('productSn').value,
            arrivalDate: document.getElementById('arrivalDate').value,
            faultDescription: document.getElementById('faultDescription').value,
            customerInfo: document.getElementById('customerInfo').value,
            customerAddress: document.getElementById('customerAddress').value
        };

        try {
            // 將資料傳送到 Google Apps Script 後端
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
                alert('🎉 工單建立成功！編號：' + result.orderId + '\nLINE 通知已發送給維修團隊。');
                liff.closeWindow(); // 成功後自動關閉 LINE 網頁視窗
            } else {
                alert('❌ 儲存失敗: ' + result.message);
                resetForm();
            }
        } catch (error) {
            alert('❌ 連線錯誤: ' + error);
            resetForm();
        }
    });

    function resetForm() {
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('loadingStatus').style.display = 'none';
    }

    // 網頁開啟時立刻執行
    initLiff();
</script>

</body>
</html>
